schema_name: deepalign_case
schema_version: 0.29
description: >-
  Machine-readable blueprint for a DeepAlign-Bench counterfactual family.
  It separates family construction, system mode, execution regime, stress stage,
  expected test intent, and post-run observations so that capability differences
  are not inferred from labels alone.

required:
  - family_id
  - task
  - environment
  - user_states
  - counterfactual_design
  - signal_condition
  - agent
  - behavioral_operator
  - evaluation_contract
  - rubric_modules
  - rubric_compilation
  - provenance

family_id: string

task:
  construction:
    source_seed_id: string
    source_type: [real_user_request, interview_derived, public_task_adapted, expert_authored_control]
    source_consent_or_license: string
    invariant_core_id: string
    evidence_world_id: string
    family_blueprint_version: string
    authoring_stage: [seeded, expert_screened, user_validated, pilot_passed, frozen]
  task_stratum: [everyday_personal, professional_enterprise, academic_frontier]
  primary_intent: [understand_synthesize, discover_enumerate, compare_decide, assess_forecast, plan_design_troubleshoot, verify_audit]
  secondary_intents: list
  domain: string
  deliverable_type: [report, decision_memo, table_or_workbook, code_and_docs, slides, webpage, multi_file]
  demand_profile:
    conceptual_breadth: [low, medium, high]
    logical_nesting: [shallow, intermediate, deep]
    exploration: [low, medium, high]
    search_fanout_target: integer_or_range
    freshness: [static, time_bounded, live]
    stakes: [low, medium, high]
    reversibility: [reversible, partly_reversible, hard_to_reverse]
    interaction_need: [single_turn, optional_clarification, required_clarification, longitudinal]
  stress_design:
    stage: [S0_clean, S1_single_light, S2_single_strong, S3_compound]
    vector:
      evidence_complexity_0_to_3: integer
      signal_complexity_0_to_3: integer
      horizon_load_0_to_3: integer
      orchestration_load_0_to_3: integer
      permission_sensitivity_0_to_3: integer
      counterfactual_subtlety_0_to_3: integer
    escalation_parent_case_id: string_or_null
    one_factor_identifiable: boolean

environment:
  execution_regime: [E1_controlled_frozen_harness, E2_native_live_product_web, E3_stateful_interactive_sandbox]
  evidence_regime: [frozen, live_web, private_workspace, hybrid]
  evidence_snapshot_id: string
  source_topology: [single_corpus, multi_source, web_plus_private, tool_generated]
  tools: list
  budget:
    wall_clock_minutes: number
    token_budget: integer_or_null
    search_budget: integer_or_null
    tool_call_budget: integer_or_null
  permissions: list
  interaction_horizon: integer
  runner_adapter:
    contract_version: string
    supported_calls: list
    # canonical calls: reset, provide_signal, run_until, inject_event,
    # export_artifact, export_trace
    trace_level: [L0_artifact_only, L1_events_and_tools, L2_state_checkpoints]
    reset_verified: boolean
    event_injection_supported: boolean

user_states:
  type: list
  min_items: 2
  item:
    user_id: string
    provenance_tier: [real_user_gold, user_anchored, synthetic_control]
    private_source_record_id: string
    consent_scope: string
    semantic_view_ids: list
    facts:
      type: list
      item:
        fact_id: string
        category: [goal, knowledge, constraint, preference, risk_or_value, audience, permission, dynamic_state]
        value: any
        source: string
        timestamp: datetime_or_null
        reliability: [confirmed, high, medium, low]
        task_relevance: [critical, useful, irrelevant_control]
        sensitivity: [public, internal, sensitive, highly_sensitive]
        allowed_for_reasoning: boolean
        allowed_to_disclose: boolean
        contract_links:
          must_change_ids: list
          must_hold_ids: list
          must_not_ids: list
    compatibility_gate:
      plausibility: boolean
      decision_relevance: boolean
      counterfactual_separability: boolean
      invariant_core: boolean
      minimality_and_privacy: boolean
      non_stereotyping: boolean

counterfactual_design:
  estimand: counterfactual_personalization_effect
  family_key: string
  counterfactual_partner_id: string
  cross_scoring_matrix_id: string
  user_conditioned_rubric_view_ids: list
  invariant_task_fields: list
  invariant_evidence_snapshot: boolean
  discriminating_user_fact_ids: list
  minimal_counterfactual_edit:
    changed_fact_ids: list
    held_constant_fact_ids: list
    edit_rationale: string
    non_demographic_causal_axis: boolean
  expected_decision_differences: list
  expected_diagonal_dominance: boolean

signal_condition:
  channel: [task_only, structured_persona, natural_history, clarification, behavior_trace, private_workspace, organizational_context, dynamic_feedback]
  view_id: string
  latent_user_state_id: string_or_null
  semantic_equivalence_group: string_or_null
  cue_form: [none, explicit_attributes, natural_narrative, interaction_trace, clarification_summary, paraphrased_low_overlap]
  cue_equivalence_role: [not_applicable, canonical, semantic_equivalent, irrelevant_surface_control]
  lexical_overlap_target: number_or_null
  visibility: [prompt, retrieved, tool_accessible, hidden_control]
  reliability: [reliable, noisy, conflicting]
  temporal_status: [current, stale, mixed]

agent:
  system_id: string
  system_mode: [M1_commercial_deep_research, M2_controlled_agent, M3_open_source_deep_research, M4_code_agent, M5_multi_agent, M6_memory_enhanced]
  system_class: [commercial_deep_research, controlled_harness, open_source_deep_research, code_agent, multi_agent, memory_augmented]
  model_or_product_version: string
  run_date: date
  search_backend: string_or_null
  memory_mode: [none, context_only, retrieval, structured_user_model, external_memory]
  orchestration: [single_agent, planner_executor, multi_agent]
  visible_tools: list
  eligibility_predicate: string

anchor_assignment:
  is_anchor: boolean
  anchor_id: [A1_everyday_decision, A2_learning_career, A3_financial_information, A4_health_information, A5_enterprise_decision, A6_software_production, A7_academic_frontier, A8_policy_communication, not_anchor]
  functional_role: string_or_null
  eligibility_gates: list
  assigned_failure_modes: list
  balanced_block_id: string_or_null
  cross_anchor_replication_ids: list

behavioral_operator: [acquire, preserve, use, update]
perturbation:
  type: [none, missing_signal, shuffled_persona, irrelevant_persona, cue_paraphrase, stale_conflict, context_dilution, tool_noise, agent_handoff, dynamic_update]
  target: [signal_bundle, signal_relevance, signal_representation, temporal_priority, context_position, tool_stream, handoff_summary, dynamic_state, none]
  base_user_state_id: string
  signal_bundle_id: string
  insert_step: integer_or_null
  authorized_visibility: [prompt, retrieved, tool_accessible, handoff_only, hidden_control]
  expected_invariants: list
  paired_control_id: string_or_null
  seed: integer
expected_failure_modes: list

evaluation_contract:
  must_change: list
  must_hold: list
  must_not: list
  clarify_if_unknown: list

rubric_modules:
  core: list
  personalization: list
  intent: list
  deliverable: list
  operator: list
  risk: list

rubric_compilation:
  # Compilation is frozen before any evaluated model output is generated.
  template_registry_version: string
  module_library_version: string
  leaf_schema_version: string
  metric_binding_version: string
  contract_bundle_id: string
  selected_template_ids: list
  selected_module_ids: list
  compiled_bundle_id: string
  compiled_before_run: boolean
  compiler_input_hash: string
  compiled_bundle_hash: string
  validation_status: [draft, author_checked, human_validated, pilot_passed, frozen]

provenance:
  author_ids: list
  reviewer_ids: list
  created_at: datetime
  last_modified_at: datetime
  evidence_hash: string
  rubric_version: string
  criterion_compiler_version: string
  license_or_consent: string

post_run_only:
  artifact_hashes: list
  trajectory_hash: string_or_null
  cost: object
  observed_outcome_risks: list
  observed_failure_evidence: list
  judge_version: string
  judge_protocol_id: string
  judge_criterion_version: string
  human_validity_role: [none, domain_expert, target_user, both]
  position_order: [AB, BA, not_applicable]
  scores: object
  confidence: number
