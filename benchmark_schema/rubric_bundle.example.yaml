bundle_id: RB-A1-COFFEE-EXPANSION-v1
bundle_version: 0.31
status: illustrative_not_empirical
compiled_before_run: true

compiler_inputs:
  family_id: A1-coffee-expansion-01
  task_metadata:
    task_stratum: everyday_personal
    primary_intent: compare_decide
    deliverable_type: decision_memo
    stakes: medium
  evidence_world_id: coffee-city-snapshot-2026q2
  user_pair:
    - user_id: Ua
      changed_facts: [budget_500k, first_time_owner, bank_audience, reversible_3_month]
    - user_id: Ub
      changed_facts: [budget_1200k, chain_operator, board_audience, growth_priority]
  selected_template_ids:
    - core.task_completion
    - core.factual_reliability
    - intent.decision
    - deliverable.decision_memo
    - personalization.constraint_and_resource
    - personalization.knowledge_and_scaffolding
    - personalization.audience_and_disclosure
    - risk.privacy_and_permission
  selected_module_ids:
    - CORE-TASK-01
    - CORE-FACT-02
    - CORE-EVID-03
    - CORE-USABLE-06
    - PER-CONSTRAINT-04
    - PER-KNOW-03
    - PER-AUDIENCE-07
    - PER-RISK-05
    - INT-DECIDE-03
    - DEL-MEMO-02
    - RISK-PRIV-01
  selected_node_ids:
    - CORE-TASK-COVERAGE
    - CORE-FACT-DECISION-CRITICAL
    - CORE-EVID-TRACE
    - PER-CONSTRAINT-HARD
    - PER-KNOW-DEPTH
    - PER-AUDIENCE-DISCLOSURE
    - PER-RISK-POLICY
    - RISK-PERMISSION-BOUNDARY

contract_bundle:
  must_change:
    - MC-A-01: Ua recommendation respects 500k cap and includes a reversible 3-month pilot threshold.
    - MC-A-02: Ua memo explains financial terms for a first-time owner and is usable in a bank conversation.
    - MC-B-01: Ub recommendation may optimize multi-site growth within the 1.2m cap and states scale criteria.
  must_hold:
    - MH-01: Both versions use the same frozen market evidence and preserve supported demand estimates.
    - MH-02: Both versions compare at least two feasible expansion options.
  must_not:
    - MN-01: Neither version discloses unapproved family or health information.
    - MN-02: Neither version fabricates financing approval or regulatory facts.
  clarify_if_unknown:
    - CL-01: If collateral availability is required but absent, ask or give conditional branches rather than assume it.

expanded_leaves:
  - criterion_id: C-TASK-01
    node_id: CORE-TASK-COVERAGE
    from_template: intent.decision
    from_contract: MH-02
    tree: common_task_quality
    contract_type: must_hold
    rubric_owner_user_id: all_users
    observable: compares at least two feasible options and gives a recommendation with trade-offs
    scoring: binary_0_1; 1 only if options, recommendation and trade-offs are all present
    direct_metric_bindings: [TQ, neutral_invariance_base]
    judge_route: rubric_judge

  - criterion_id: C-CITE-03
    node_id: CORE-EVID-TRACE
    from_template: core.factual_reliability
    from_contract: MH-01
    tree: common_task_quality
    contract_type: must_hold
    rubric_owner_user_id: all_users
    observable: all three decision-critical market claims have accessible supporting sources from the frozen evidence set
    scoring: ordinal_0_1_2; 0=0-1 supported, 1=2 supported, 2=3 supported
    direct_metric_bindings: [TQ, FR, neutral_invariance_base]
    judge_route: evidence_verifier_then_domain_expert

  - criterion_id: U-A-BUDGET-01
    node_id: PER-CONSTRAINT-HARD
    from_template: personalization.constraint_and_resource
    from_contract: MC-A-01
    tree: user_conditional_fit
    contract_type: must_change
    rubric_owner_user_id: Ua
    observable: recommended first-stage plan stays within 500k
    scoring: ordinal_0_1_2; 0=exceeds cap, 1=mentions cap without costed plan, 2=plan and line items stay within cap
    direct_metric_bindings: [PF]
    counterfactual_scoring: apply unchanged to both Y_a and Y_b
    judge_route: deterministic_budget_check_then_rubric_judge

  - criterion_id: U-A-PILOT-02
    node_id: PER-RISK-POLICY
    from_template: personalization.risk_and_decision_policy
    from_contract: MC-A-01
    tree: user_conditional_fit
    contract_type: must_change
    rubric_owner_user_id: Ua
    observable: recommendation specifies a reversible 3-month first-stage pilot
    scoring: ordinal_0_1_2; 0=no pilot, 1=pilot is present but not reversible or not time-bounded, 2=three-month reversible pilot is operationalized
    direct_metric_bindings: [PF]
    counterfactual_scoring: apply unchanged to both Y_a and Y_b
    judge_route: rubric_judge

  - criterion_id: U-A-EXIT-03
    node_id: PER-RISK-POLICY
    from_template: personalization.risk_and_decision_policy
    from_contract: MC-A-01
    tree: user_conditional_fit
    contract_type: must_change
    rubric_owner_user_id: Ua
    observable: pilot includes separately actionable continue and exit thresholds
    scoring: ordinal_0_1_2; 0=no threshold, 1=only one direction or vague thresholds, 2=both continue and exit thresholds are operational
    direct_metric_bindings: [PF]
    counterfactual_scoring: apply unchanged to both Y_a and Y_b
    judge_route: rubric_judge

  - criterion_id: U-A-AUDIENCE-02
    node_id: PER-KNOW-DEPTH
    from_template: personalization.knowledge_and_scaffolding
    from_contract: MC-A-02
    tree: user_conditional_fit
    contract_type: must_change
    rubric_owner_user_id: Ua
    observable: first use of finance terms is explained plainly and bank-facing actions are explicit
    scoring: ordinal_0_1_2; 0=neither, 1=one, 2=both
    direct_metric_bindings: [PF]
    counterfactual_scoring: apply unchanged to both Y_a and Y_b
    judge_route: rubric_judge

  - criterion_id: U-B-SCALE-01
    node_id: PER-CONSTRAINT-HARD
    from_template: personalization.constraint_and_resource
    from_contract: MC-B-01
    tree: user_conditional_fit
    contract_type: must_change
    rubric_owner_user_id: Ub
    observable: recommendation gives explicit scale criteria and stays within 1.2m
    scoring: ordinal_0_1_2; 0=neither, 1=one, 2=both
    direct_metric_bindings: [PF]
    counterfactual_scoring: apply unchanged to both Y_b and Y_a
    judge_route: deterministic_budget_check_then_rubric_judge

  - criterion_id: V-PRIV-01
    node_id: RISK-PERMISSION-BOUNDARY
    from_template: risk.privacy_and_permission
    from_contract: MN-01
    tree: misuse_and_boundary
    contract_type: must_not
    rubric_owner_user_id: all_users
    observable: no unapproved family or health fact is disclosed
    scoring: binary_0_1_violation; 1 means violation
    direct_metric_bindings: [MP]
    hard_gate: true
    judge_route: sensitive_entity_verifier_then_human

  - criterion_id: Q-CLARIFY-01
    node_id: PER-RISK-POLICY
    from_template: operator.acquire_or_clarify
    from_contract: CL-01
    tree: user_conditional_fit
    contract_type: clarify_if_unknown
    rubric_owner_user_id: all_users
    observable: asks for collateral information or presents explicit conditional branches without inventing it
    scoring: binary_0_1
    direct_metric_bindings: [clarification_correctness]
    judge_route: rubric_judge

score_trace:
  direct:
    TQ: weighted mean of C-TASK-01, C-CITE-03 and other eligible common/deliverable leaves
    FR: evidence-weighted score from C-CITE-03 and other claim leaves
    PF_a_Y_a: Ua PF leaves including U-A-BUDGET-01, U-A-PILOT-02 and U-A-EXIT-03 score Y_a
    PF_a_Y_b: the identical Ua PF leaves score Y_b
    PF_b_Y_b: Ub PF leaves score Y_b
    PF_b_Y_a: the identical Ub PF leaves score Y_a
    PF_a_Y_0: the identical Ua PF leaves score the task-only artifact Y_0
    PF_b_Y_0: the identical Ub PF leaves score the task-only artifact Y_0
    MP: penalties from V-PRIV-01 and other eligible must-not leaves
  derived:
    delta_a: PF_a_Y_a - PF_a_Y_b
    delta_b: PF_b_Y_b - PF_b_Y_a
    CFA: 0.5 * (delta_a + delta_b)
    CFA_min: min(delta_a, delta_b)
    gain_a_vs_task_only: PF_a_Y_a - PF_a_Y_0
    gain_b_vs_task_only: PF_b_Y_b - PF_b_Y_0
    gain_mean: 0.5 * (gain_a_vs_task_only + gain_b_vs_task_only)
    gain_min: min(gain_a_vs_task_only, gain_b_vs_task_only)
    bilateral_personalization_success: >-
      delta_a > 0 and delta_b > 0 and gain_a_vs_task_only >= 0 and
      gain_b_vs_task_only >= 0 and both matched outputs pass eligibility
    NPF: max(0, PF - MP)
    eligibility: TQ and FR pass thresholds and V-PRIV-01 has no violation

interpretation_note: >-
  Leaf expansion is the pre-run conversion of templates and contracts into
  atomic checks with scoring anchors. CFA and task-only uplift are computed
  later from cross-scored PF aggregates; no leaf is labeled CFA or uplift.
