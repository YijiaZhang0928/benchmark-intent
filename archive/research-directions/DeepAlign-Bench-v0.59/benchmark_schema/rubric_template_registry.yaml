registry_name: deepalign_rubric_template_registry
registry_version: 0.55
module_library: rubric_module_library.yaml
node_registry: rubric_node_registry.yaml
description: >-
  Declarative template registry used by the Rubric Compiler. Templates are
  selected by metadata predicates, then instantiated from contracts and
  evidence and a frozen Counterfactual Difference Map. Domain facts are
  parameters, not reasons to invent a new scoring
  format for every domain.

compilation_order:
  - validate_case_and_contracts
  - validate_difference_map_provenance_and_freeze
  - select_eligible_templates
  - select_applicable_direction_nodes
  - instantiate_template_parameters
  - expand_to_atomic_leaves
  - validate_coverage_conflicts_and_symmetry
  - freeze_rubric_bundle_before_runs

template_families:
  core:
    routing: always
    required_templates:
      - core.task_completion
      - core.factual_reliability
      - core.traceable_evidence
      - core.basic_usability
    typical_direct_metrics: [TQ, FR]

  personalization:
    routing: counterfactual_difference_map contains must_change or clarify_if_unknown nodes
    expansion: one_or_more_leaves_per_frozen_difference_map_node
    templates:
      - personalization.goal_and_success
      - personalization.knowledge_and_scaffolding
      - personalization.constraint_and_resource
      - personalization.risk_and_decision_policy
      - personalization.audience_and_disclosure
      - personalization.workflow_and_action
    typical_direct_metrics: [PF]

  research_intent:
    routing_field: task.primary_intent
    routes:
      understand_synthesize: intent.synthesis
      discover_enumerate: intent.discovery
      compare_decide: intent.decision
      assess_forecast: intent.assessment
      plan_design_troubleshoot: intent.plan_design
      verify_audit: intent.audit
    typical_direct_metrics: [TQ, FR]

  deliverable:
    routing_field: task.deliverable_type
    routes:
      report: deliverable.report
      decision_memo: deliverable.decision_memo
      table_or_workbook: deliverable.table_or_workbook
      code_and_docs: deliverable.code_and_docs
      slides: deliverable.slides
      webpage: deliverable.webpage
      multi_file: deliverable.multi_file
    typical_direct_metrics: [TQ]

  operator:
    routing_field: behavioral_operator
    routes:
      acquire: operator.acquire_or_clarify
      preserve: operator.preserve_under_pressure
      use: operator.apply_to_delivery
      update: operator.adopt_current_state_and_suppress_stale_state
    typical_direct_metrics: [operator_diagnostic, clarification_correctness]

  risk:
    routing: >-
      task.demand_profile.stakes != low OR user facts include sensitive data OR
      permissions are constrained OR evaluation_contract.must_not is not empty
    templates:
      - risk.privacy_and_permission
      - risk.safety_and_noncompensation
      - risk.uncertainty_and_escalation
      - risk.stale_or_conflicting_state
    typical_direct_metrics: [MP, FR, clarification_correctness]

expansion_rules:
  - rule_id: expand.core_shared_requirement
    source: common_task_requirement
    emit: one_leaf_per_independently_verifiable_requirement
    default_tree: common_task_quality
    default_contract_type: core
  - rule_id: expand.must_change
    source: counterfactual_difference_map.must_change_nodes
    emit: one_leaf_per_user_per_distinct_expected_delivery_change
    default_tree: user_conditional_fit
    default_metric: PF
  - rule_id: expand.must_hold
    source: counterfactual_difference_map.must_hold_nodes
    emit: one_shared_quality_leaf_plus_one_cross_artifact_invariance_binding_when_applicable
    default_tree: common_task_quality
    default_metrics: [TQ, neutral_invariance_base]
  - rule_id: expand.must_not
    source: counterfactual_difference_map.must_not_nodes
    emit: one_violation_leaf_per_distinct_boundary
    default_tree: misuse_and_boundary
    default_metric: MP
  - rule_id: expand.clarify
    source: counterfactual_difference_map.clarify_if_unknown_nodes
    emit: one_leaf_for_question_or_valid_conditional_branch_and_one_penalty_path_for_unsupported_assumption
    default_tree: user_conditional_fit
    default_metrics: [clarification_correctness, MP]

validation_gates:
  - every_user_conditional_leaf_has_a_frozen_difference_map_node_and_authority_record
  - all_required_case_fields_resolve
  - every_task_relevant_user_fact_maps_to_a_contract_or_is_removed
  - every_contract_expands_to_at_least_one_leaf
  - every_leaf_has_exact_scoring_anchors_and_a_judge_route
  - every_direct_metric_binding_is_declared
  - user_a_and_user_b_leaves_are_counterfactually_symmetric_or_difference_is_justified
  - no_duplicate_or_logically_conflicting_leaves
  - no_sensitive_fact_is_exposed_outside_authorized_scope
  - dependent_or_redundant_leaves_are_grouped_and_aggregated_at_node_before_metric
  - reference_matched_beats_swapped_on_pf_without_breaking_tq_fr_or_must_not

authoring_policy:
  llm_may_propose_draft_leaves: true
  human_validation_required: true
  compiler_is_deterministic_after_freeze: true
  evaluated_outputs_visible_during_compilation: false
