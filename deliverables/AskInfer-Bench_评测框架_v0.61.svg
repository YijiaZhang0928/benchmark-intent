<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AskInfer-Bench v0.61 evaluation framework</title>
  <desc id="desc">A deterministic research diagram connecting the PDR 50-to-15 personalization-diagnostic task screen, human-grounded preference divergence, Ask and Infer tracks, final crossed-user evaluation, and ranking stability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#edf3f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#466985"/>
    </marker>
    <style>
      .sans { font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 760; fill: #102d47; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #4d657a; }
      .kicker { font-size: 13px; font-weight: 760; letter-spacing: 2px; fill: #38739a; }
      .panel-title { font-size: 22px; font-weight: 750; fill: #163a57; }
      .panel-sub { font-size: 14px; font-weight: 650; fill: #507086; }
      .body { font-size: 15px; fill: #29485f; }
      .small { font-size: 13px; fill: #516b7d; }
      .chip { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .metric { font-size: 14px; font-weight: 650; fill: #1f4f6f; }
      .formula { font-size: 14px; font-family: "SFMono-Regular", Consolas, monospace; fill: #203f58; }
      .footer { font-size: 15px; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="52" y="42" width="1496" height="116" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="86" y="78" class="sans kicker">RESEARCH PROPOSAL · v0.61 · 2026-09-03</text>
  <text x="86" y="122" class="sans title">Ask or Infer?</text>
  <text x="390" y="120" class="sans subtitle">Evaluating Task-Specific Personalization in Research, Coding, and Data-Analysis Agents</text>
  <text x="86" y="146" class="sans subtitle">核心：有限问题预算是否投向真正改变交付物的偏好；用户离线时是否只做 evidence-bounded inference。</text>

  <rect x="52" y="184" width="306" height="568" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="78" y="220" class="sans kicker">01 · TASK SCREEN &amp; CASE</text>
  <text x="78" y="256" class="sans panel-title">先筛任务，再构造用户差异</text>
  <text x="78" y="284" class="sans body">PDR 50 → 15 · leverage + hard gates</text>
  <text x="78" y="307" class="sans body">不随机抽样 · 不用 domain 配额</text>

  <rect x="78" y="334" width="254" height="78" rx="14" fill="#eef4f8"/>
  <rect x="92" y="348" width="52" height="24" rx="12" fill="#7a91a2"/>
  <text x="105" y="365" class="sans chip">δ = 0</text>
  <text x="92" y="391" class="sans body">不应改变内容决定 · invariance</text>

  <rect x="78" y="426" width="254" height="78" rx="14" fill="#fff6dc"/>
  <rect x="92" y="440" width="64" height="24" rx="12" fill="#b78422"/>
  <text x="104" y="457" class="sans chip">LOW δ</text>
  <text x="92" y="483" class="sans body">非关键但有确认效用的变化</text>

  <rect x="78" y="518" width="254" height="92" rx="14" fill="#ffece7"/>
  <rect x="92" y="532" width="70" height="24" rx="12" fill="#b34d3d"/>
  <text x="104" y="549" class="sans chip">HIGH δ</text>
  <text x="92" y="575" class="sans body">改变 evidence / algorithm / metric</text>
  <text x="92" y="596" class="sans body">slice / conclusion / risk boundary</text>

  <line x1="78" y1="636" x2="332" y2="636" stroke="#d8e3eb"/>
  <text x="78" y="665" class="sans panel-sub">双重人工 qualification</text>
  <text x="78" y="690" class="sans small">先盲审 task，再另审 A/B user pair</text>
  <text x="78" y="712" class="sans small">冻结 2–4 nodes / history / rubric</text>
  <text x="78" y="734" class="sans small">禁止根据 agent 输出换题</text>

  <path d="M 368 468 C 398 468, 400 468, 424 468" stroke="#466985" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="424" y="184" width="724" height="568" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="452" y="220" class="sans kicker">02 · TWO REALISTIC INFORMATION POLICIES</text>

  <rect x="452" y="246" width="326" height="384" rx="20" fill="#eaf5fb" stroke="#b8dae9"/>
  <rect x="476" y="270" width="76" height="26" rx="13" fill="#2782a8"/>
  <text x="497" y="288" class="sans chip">ASK</text>
  <text x="476" y="328" class="sans panel-title">用户在线，history 被裁减</text>
  <text x="476" y="358" class="sans body">Research · Coding · Data Analysis</text>
  <text x="476" y="389" class="sans panel-sub">A0 No-Ask</text>
  <text x="476" y="413" class="sans small">同一 history，关闭用户通道</text>
  <text x="476" y="446" class="sans panel-sub">A1 Ask-Enabled</text>
  <text x="476" y="470" class="sans small">固定 question / turn / token budget</text>
  <text x="476" y="503" class="sans panel-sub">A2 Task-Specific Oracle</text>
  <text x="476" y="527" class="sans small">直接给全部已确认 task-relevant nodes</text>
  <line x1="476" y1="552" x2="752" y2="552" stroke="#bad7e5"/>
  <text x="476" y="578" class="sans metric">High-δ Recall · Precision · Stop</text>
  <text x="476" y="601" class="sans metric">Burden · Acquisition-to-Use</text>

  <rect x="794" y="246" width="326" height="384" rx="20" fill="#f1eefb" stroke="#d2c7ec"/>
  <rect x="818" y="270" width="84" height="26" rx="13" fill="#7457a6"/>
  <text x="836" y="288" class="sans chip">INFER</text>
  <text x="818" y="328" class="sans panel-title">用户离线，禁止提问</text>
  <text x="818" y="358" class="sans body">首版仅 Deep Research</text>
  <text x="818" y="389" class="sans panel-sub">I0 Task-Only</text>
  <text x="818" y="413" class="sans small">无 history</text>
  <text x="818" y="446" class="sans panel-sub">I1 Natural-History Infer</text>
  <text x="818" y="470" class="sans small">recoverable 用；unidentifiable 不猜</text>
  <text x="818" y="503" class="sans panel-sub">I2 Oracle · I3 PDR Bridge</text>
  <text x="818" y="527" class="sans small">task-specific truth / full persona</text>
  <line x1="818" y1="552" x2="1094" y2="552" stroke="#d0c7e5"/>
  <text x="818" y="578" class="sans metric">Recoverable Use · Projection Rate</text>
  <text x="818" y="601" class="sans metric">Irrelevant Flip · Uncertainty</text>

  <rect x="452" y="650" width="668" height="76" rx="16" fill="#f7f9fb" stroke="#dce6ed"/>
  <text x="474" y="678" class="sans panel-sub">共享 history observability</text>
  <text x="474" y="705" class="sans body">recoverable · missing_askable · unidentifiable · irrelevant</text>

  <path d="M 1158 468 C 1188 468, 1190 468, 1214 468" stroke="#466985" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="1214" y="184" width="334" height="568" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="1240" y="220" class="sans kicker">03 · OUTCOMES &amp; RANKS</text>
  <text x="1240" y="256" class="sans panel-title">过程与交付物不可补偿</text>

  <rect x="1240" y="282" width="282" height="132" rx="16" fill="#eef5f9"/>
  <text x="1258" y="309" class="sans panel-sub">Ask Calibration</text>
  <text x="1258" y="338" class="sans formula">logit P(ask) = α + β·δ + ...</text>
  <text x="1258" y="366" class="sans body">β &gt; 0：问题预算随 impact 增加</text>
  <text x="1258" y="391" class="sans small">family-clustered；node 不是独立 n</text>

  <rect x="1240" y="430" width="282" height="154" rx="16" fill="#f4f0fb"/>
  <text x="1258" y="458" class="sans panel-sub">Final crossed-user matrix</text>
  <text x="1258" y="487" class="sans formula">ΔA = PF_A(Y_A) - PF_A(Y_B)</text>
  <text x="1258" y="512" class="sans formula">ΔB = PF_B(Y_B) - PF_B(Y_A)</text>
  <text x="1258" y="538" class="sans formula">CFA_min = min(ΔA, ΔB)</text>
  <text x="1258" y="565" class="sans small">adequacy · gain · no-harm · boundary</text>

  <rect x="1240" y="600" width="282" height="126" rx="16" fill="#fff5e6"/>
  <text x="1258" y="628" class="sans panel-sub">PDR → Ask / Infer ranking</text>
  <text x="1258" y="657" class="sans body">Kendall τ · Spearman ρ</text>
  <text x="1258" y="680" class="sans body">Pairwise inversion · cluster bootstrap</text>
  <text x="1258" y="706" class="sans small">反转是待检验结果，不是先验结论</text>

  <rect x="52" y="778" width="1496" height="82" rx="22" fill="#153a56"/>
  <text x="78" y="808" class="sans kicker" fill="#8ed0ec">CLAIM BOUNDARY</text>
  <text x="78" y="836" class="sans footer">测可观察的 preference acquisition、evidence-bounded inference 与 final utilization；不声称内部“理解用户”，不把 PDR 叫 implicit elicitation，不把 CFA 当提问分。</text>
</svg>
