schema_name: deepalign_case
schema_version: 0.59
description: >-
  Machine-readable blueprint for a DeepAlign-Bench counterfactual family.
  It separates family construction, system mode, execution regime, stress stage,
  expected test intent, and post-run observations so that capability differences
  are not inferred from labels alone.

required:
  - family_id
  - task
  - environment
  - user_states
  - counterfactual_design
  - signal_condition
  - research_episode
  - agent
  - behavioral_operator
  - human_ground_truth
  - counterfactual_difference_map
  - evaluation_contract
  - rubric_modules
  - rubric_compilation
  - judge_qualification
  - downstream_decision_design
  - provenance

family_id: string

task:
  knowledge_work_regime: [open_web_research, repository_software_engineering, data_centric_analysis]
  construction:
    source_seed_id: string
    source_type: [real_user_request, interview_derived, public_task_adapted, expert_authored_control]
    source_consent_or_license: string
    invariant_core_id: string
    evidence_world_id: string
    family_blueprint_version: string
    authoring_stage: [seeded, expert_screened, user_validated, pilot_passed, frozen]
  task_stratum: [everyday_personal, professional_enterprise, academic_frontier]
  primary_intent: [understand_synthesize, discover_enumerate, compare_decide, assess_forecast, plan_design_troubleshoot, verify_audit]
  secondary_intents: list
  domain: string
  output_mode: [retrieval_synthesis_not_prescriptive, repository_modification, data_analysis_artifact]
  primary_deliverable:
    unit_count: 1
    artifact_type: string
    label: string
    embedded_components_allowed: true
    separately_scored_secondary_deliverables: false
    container_rule: supporting_tables_figures_logs_tests_and_explanations_are_internal_to_the_primary_artifact
  deep_research_boundary:
    required_when: knowledge_work_regime_equals_open_web_research
    prescriptive_recommendation_forbidden: true
    allowed_user_conditioned_effects: [scope, inclusion_or_exclusion, field_priority, evidence_threshold, granularity, explanation_depth]
  demand_profile:
    conceptual_breadth: [low, medium, high]
    logical_nesting: [shallow, intermediate, deep]
    exploration: [low, medium, high]
    search_fanout_target: integer_or_range
    freshness: [static, time_bounded, live]
    stakes: [low, medium, high]
    reversibility: [reversible, partly_reversible, hard_to_reverse]
    interaction_need: [single_turn, optional_clarification, required_clarification, longitudinal]
  stress_design:
    stage: [S0_clean, S1_single_light, S2_single_strong, S3_compound]
    vector:
      evidence_complexity_0_to_3: integer
      signal_complexity_0_to_3: integer
      horizon_load_0_to_3: integer
      orchestration_load_0_to_3: integer
      permission_sensitivity_0_to_3: integer
      counterfactual_subtlety_0_to_3: integer
    escalation_parent_case_id: string_or_null
    one_factor_identifiable: boolean

environment:
  execution_regime: [E1_controlled_frozen_harness, E2_native_live_product_web, E3_stateful_interactive_sandbox]
  evidence_regime: [frozen, live_web, private_workspace, hybrid]
  evidence_snapshot_id: string
  primary_asset_type: [web_corpus_snapshot, repository_snapshot, dataset_snapshot, workbook_snapshot, hybrid_asset_snapshot]
  source_topology: [single_corpus, multi_source, web_plus_private, tool_generated]
  tools: list
  budget:
    wall_clock_minutes: number
    token_budget: integer_or_null
    search_budget: integer_or_null
    tool_call_budget: integer_or_null
  permissions: list
  interaction_horizon: integer
  runner_adapter:
    contract_version: string
    supported_calls: list
    # canonical calls: reset, provide_signal, run_until, inject_event,
    # export_artifact, export_trace
    trace_level: [L0_artifact_only, L1_events_and_tools, L2_state_checkpoints]
    reset_verified: boolean
    event_injection_supported: boolean

user_states:
  type: list
  min_items: 2
  item:
    user_id: string
    provenance_tier: [real_user_gold, user_anchored, synthetic_control]
    private_source_record_id: string
    consent_scope: string
    semantic_view_ids: list
    facts:
      type: list
      item:
        fact_id: string
        category: [goal, knowledge, constraint, preference, risk_or_value, audience, permission, dynamic_state]
        value: any
        source: string
        timestamp: datetime_or_null
        reliability: [confirmed, high, medium, low]
        task_relevance: [critical, useful, irrelevant_control]
        sensitivity: [public, internal, sensitive, highly_sensitive]
        allowed_for_reasoning: boolean
        allowed_to_disclose: boolean
        contract_links:
          must_change_ids: list
          must_hold_ids: list
          must_not_ids: list
    compatibility_gate:
      plausibility: boolean
      decision_relevance: boolean
      counterfactual_separability: boolean
      invariant_core: boolean
      minimality_and_privacy: boolean
      non_stereotyping: boolean

counterfactual_design:
  estimand: counterfactual_user_specificity_profile
  family_key: string
  counterfactual_partner_id: string
  cross_scoring_matrix_id: string
  user_conditioned_rubric_view_ids: list
  invariant_task_fields: list
  invariant_evidence_snapshot: boolean
  discriminating_user_fact_ids: list
  minimal_counterfactual_edit:
    changed_fact_ids: list
    held_constant_fact_ids: list
    edit_rationale: string
    non_demographic_causal_axis: boolean
  expected_decision_differences: list
  expected_diagonal_dominance: boolean
  task_only_default_audit:
    expected_affinity_before_generation: [toward_user_a, toward_user_b, neutral, unknown]
    observed_affinity_after_generation: [toward_user_a, toward_user_b, neutral, mixed]
    labels_randomly_swappable: boolean
    default_affinity_balanced_across_families: boolean

downstream_decision_design:
  protocol_version: string
  phase: [A_artifact_qualification, B_human_decision_trial]
  decision_family_id: string
  equivalent_task_shell_group_id: string
  treatment_arms: [task_only, matched_personalized, swapped_personalized]
  primary_estimand: downstream_decision_effect
  utility_spec_id: string
  utility_frozen_before_artifact_generation: boolean
  evidence_dependent_tradeoff_verified: boolean
  artifact_quality_equivalence_gate_id: string
  target_user_required: boolean
  randomization_block_id: string
  order_schedule_id: string
  blinding: [condition_blind, condition_and_agent_blind]
  consent_or_ethics_record_id: string

signal_condition:
  channel: [task_only, structured_persona, natural_history, fuzzy_query_clarification, behavior_trace, private_workspace, organizational_context, dynamic_feedback]
  view_id: string
  latent_user_state_id: string_or_null
  semantic_equivalence_group: string_or_null
  cue_form: [none, explicit_attributes, natural_narrative, interaction_trace, clarification_summary, paraphrased_low_overlap]
  cue_equivalence_role: [not_applicable, canonical, semantic_equivalent, irrelevant_surface_control]
  lexical_overlap_target: number_or_null
  visibility: [prompt, retrieved, tool_accessible, hidden_control]
  reliability: [reliable, noisy, conflicting]
  temporal_status: [current, stale, mixed]
  fuzzy_query_clarification:
    applicable: boolean
    initial_query_id: string_or_null
    query_is_generally_executable: boolean_or_null
    hidden_decision_relevant_fact_ids: list
    max_clarification_turns: integer_or_null
    simulator_policy: [not_applicable, ledger_bounded_unknown_outside_ledger, live_target_user]
    no_ask_control_case_id: string_or_null
    structured_persona_oracle_case_id: string_or_null
    required_node_ids: list
    prohibited_sensitive_question_ids: list

research_episode:
  schema_ref: research_episode.schema.yaml
  paradigm_id: [P0_task_only_closed, P1_one_shot_direct, P2_pre_research_clarification, P3_in_research_interactive, P4_checkpoint_update, P5_memory_retrieval, P6_workspace_grounded, P7_draft_feedback_revision]
  episode_spec_id: string
  information_event_schedule_id: string
  capability_eligibility: [eligible, structurally_inapplicable, deferred]

agent:
  system_id: string
  system_mode: [M1_commercial_deep_research, M2_controlled_agent, M3_open_source_deep_research, M4_code_agent, M5_multi_agent, M6_memory_enhanced, M7_data_analysis_agent]
  system_class: [commercial_deep_research, controlled_harness, open_source_deep_research, code_agent, multi_agent, memory_augmented, data_analysis_agent]
  model_or_product_version: string
  run_date: date
  search_backend: string_or_null
  memory_mode: [none, context_only, retrieval, structured_user_model, external_memory]
  orchestration: [single_agent, planner_executor, multi_agent]
  visible_tools: list
  eligibility_predicate: string

anchor_assignment:
  is_anchor: boolean
  anchor_id: [A1_everyday_decision, A2_learning_career, A3_financial_information, A4_health_information, A5_enterprise_decision, A6_software_production, A7_academic_frontier, A8_policy_communication, not_anchor]
  functional_role: string_or_null
  eligibility_gates: list
  assigned_failure_modes: list
  balanced_block_id: string_or_null
  cross_anchor_replication_ids: list

behavioral_operator: [acquire, preserve, use, update]
perturbation:
  type: [none, missing_signal, shuffled_persona, irrelevant_persona, cue_paraphrase, stale_conflict, context_dilution, tool_noise, agent_handoff, dynamic_update]
  target: [signal_bundle, signal_relevance, signal_representation, temporal_priority, context_position, tool_stream, handoff_summary, dynamic_state, none]
  base_user_state_id: string
  signal_bundle_id: string
  insert_step: integer_or_null
  authorized_visibility: [prompt, retrieved, tool_accessible, handoff_only, hidden_control]
  expected_invariants: list
  paired_control_id: string_or_null
  seed: integer
expected_failure_modes: list

evaluation_contract:
  status: compatibility_view_compiled_from_counterfactual_difference_map
  must_change: list
  must_hold: list
  must_not: list
  clarify_if_unknown: list

human_ground_truth:
  protocol_ref: human_ground_truth.protocol.yaml
  offered_task_slate_record_ids: list
  user_ledger_ids: list
  user_confirmation_record_ids: list
  authority_conflict_record_ids: list
  privacy_and_consent_record_ids: list

counterfactual_difference_map:
  schema_ref: counterfactual_difference_map.schema.yaml
  map_id: string
  map_version: string
  pair_type: [contrast, near_neighbor, neutral_invariance]
  node_ids: list
  pair_selection_audit_id: string
  construction_freeze_hash: string
  evaluation_freeze_hash: string

rubric_modules:
  core: list
  personalization: list
  intent: list
  deliverable: list
  operator: list
  risk: list

rubric_compilation:
  # Compilation is frozen before any evaluated model output is generated.
  template_registry_version: string
  module_library_version: string
  node_registry_version: string
  leaf_schema_version: string
  metric_binding_version: string
  contract_bundle_id: string
  difference_map_id: string
  difference_map_hash: string
  selected_template_ids: list
  selected_module_ids: list
  selected_node_ids: list
  compiled_bundle_id: string
  compiled_before_run: boolean
  compiler_input_hash: string
  compiled_bundle_hash: string
  validation_status: [draft, author_checked, human_validated, pilot_passed, frozen]

judge_qualification:
  protocol_ref: judge_qualification.protocol.yaml
  suite_name: D-JQS
  judge_version: string
  qualification_split_id: string
  eligible_leaf_class_ids: list
  ineligible_leaf_class_ids: list
  qualification_status: [not_run, partial, passed_declared_slices, failed]
  report_id: string

provenance:
  author_ids: list
  reviewer_ids: list
  created_at: datetime
  last_modified_at: datetime
  evidence_hash: string
  rubric_version: string
  criterion_compiler_version: string
  license_or_consent: string
  construction_annotation_protocol_version: string
  pre_run_annotation_record_ids: list

post_run_only:
  artifact_hashes: list
  trajectory_hash: string_or_null
  cost: object
  observed_outcome_risks: list
  observed_failure_evidence: list
  judge_version: string
  judge_protocol_id: string
  judge_criterion_version: string
  human_validity_role: [none, domain_expert, target_user, both]
  position_order: [AB, BA, not_applicable]
  scores: object
  confidence: number
  artifact_stress_type: [ordinary_system_output, matched_reference, swapped_reference, general_good, over_personalized, mention_only, irrelevant_persona_keyword]
  clarification_trace:
    asked: boolean_or_null
    turns: integer_or_null
    asked_node_ids: list
    answered_node_ids: list
    planned_node_ids: list
    adopted_in_final_node_ids: list
    unnecessary_question_ids: list
    privacy_or_boundary_violation_ids: list
    user_burden_score: number_or_null
  decision_trial_outcome:
    participant_id: string_or_null
    task_shell_id: string_or_null
    assigned_arm: [task_only, matched_personalized, swapped_personalized, not_applicable]
    baseline_decision_id: string_or_null
    final_decision_id: string_or_null
    baseline_confidence: number_or_null
    final_confidence: number_or_null
    utility_value: number_or_null
    decision_regret: number_or_null
    hard_constraint_violations: list
    decision_time_seconds: number_or_null
    burden_score: number_or_null
