[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepalign-bench"
version = "0.58.0"
description = "Interaction environments for evaluating personalized deep-research agents"
readme = "interaction_env/README.md"
requires-python = ">=3.10"
authors = [{ name = "DeepAlign-Bench contributors" }]
dependencies = []

[project.scripts]
deepalign-bench = "deepalign_bench.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepalign_bench = ["data/*.json"]

[tool.unittest]
start-directory = "tests"
